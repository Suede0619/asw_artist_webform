services:
  - type: web
    name: artsouthwest-web
    runtime: node
    plan: 0.5c-512mb
    region: ohio
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npm run build && npm run build:catalog
    startCommand: node scripts/domain-origin.mjs
    healthCheckPath: /healthz
    domains:
      - artsouthwest.com
      - artist.artsouthwest.com
      - curator.artsouthwest.com
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CATALOG_DIR
        value: ./build/catalog
      - key: DATA_DIR
        value: /tmp/artsouthwest
      - key: CALLBACK_OWNER
        value: taos-city-lead
      - key: MAIL_DISABLED
        value: "1"
      - key: REVIEWER_PASSWORD
        sync: false
      - key: MAIL_QUEUE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
